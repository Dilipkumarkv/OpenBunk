# Local/staging-like single-host stack. NOT a production blueprint as-is —
# see docs/deployment.md (HTTPS, secrets, backups required for real deployments).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openbunk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbunk-dev-only}
      POSTGRES_DB: openbunk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openbunk -d openbunk']
      interval: 5s
      timeout: 3s
      retries: 12
    # never publish the database port; API talks to it over the internal network
    networks: [internal]

  # Schema migrations run once, under a Postgres advisory lock, before the API starts.
  # The API never migrates on boot, so a restart cannot race another replica.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['python', '-m', 'app.migrate']
    environment:
      DATABASE_URL: postgresql+psycopg://openbunk:${POSTGRES_PASSWORD:-openbunk-dev-only}@db:5432/openbunk
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://openbunk:${POSTGRES_PASSWORD:-openbunk-dev-only}@db:5432/openbunk
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RATE_LIMIT_PER_MINUTE: '20'
      # Demo seed PIN — development/staging only. Leave empty for real stations so
      # no demo employees are created; production rejects weak/default PINs.
      OPENBUNK_SEED_PIN: ${OPENBUNK_SEED_PIN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).read() else 1)"',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    # Loopback only: put a TLS-terminating reverse proxy in front for real use.
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
