name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Dependency vulnerability scan (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  compose:
    name: Compose stack rehearsal
    runs-on: ubuntu-latest
    env:
      OPENBUNK_SEED_PIN: '246813'
      POSTGRES_PASSWORD: ci-staging-only-password
      ENVIRONMENT: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build stack
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d
          # one-shot migrate service must exit 0 before the API is allowed to run
          for i in $(seq 1 30); do
            line=$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | grep '^migrate ' || true)
            if [ "$line" = "migrate 0" ]; then echo "migrations completed"; exit 0; fi
            sleep 2
          done
          docker compose logs migrate
          exit 1

      - name: Migrations ran once in the dedicated service
        run: |
          docker compose logs migrate | grep -q 'Running upgrade'
          docker compose ps --status exited migrate | grep -q 'migrate'

      - name: Seed demo station (rehearsal only)
        run: docker compose exec -T api python -m app.seed

      - name: Verify web, proxy and API
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/healthz
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/api/v1/readiness
          curl --fail --retry 10 --retry-delay 2 -s http://localhost:8080/ | grep -i openbunk
          curl --fail -X POST http://localhost:8080/api/v1/session \
            -H 'Content-Type: application/json' \
            -d '{"station_code":"OB-001","employee_code":"EMP-00","pin":"246813"}' | grep -q access_token

      - name: Logs must not contain secrets
        run: |
          ! docker compose logs api | grep -iE 'argon2|pin_hash|password|secret'

      - name: Tear down
        if: always()
        run: docker compose down -v

  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openbunk
          POSTGRES_PASSWORD: openbunk
          POSTGRES_DB: openbunk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbunk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://openbunk:openbunk@localhost:5432/openbunk
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r backend/requirements.txt pip-audit

      - name: Install PostgreSQL 16 client tools (must match the server major)
        run: |
          # Ubuntu 24.04 ships PostgreSQL 16; the runner may default to a newer
          # client, which writes settings a 16 server rejects during restore.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Dependency vulnerability scan
        run: python -m pip_audit --requirement backend/requirements.txt --strict

      - name: Migration check (from empty database)
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Models and migrations agree (alembic check)
        run: python -m alembic check
        working-directory: backend

      - name: Advisory-lock migration runner is idempotent
        run: python -m app.migrate
        working-directory: backend

      - name: Run backend tests (PostgreSQL)
        run: python -m pytest -q
        working-directory: backend
