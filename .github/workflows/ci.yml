name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Dependency vulnerability scan (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openbunk
          POSTGRES_PASSWORD: openbunk
          POSTGRES_DB: openbunk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbunk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://openbunk:openbunk@localhost:5432/openbunk
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r backend/requirements.txt pip-audit

      - name: Dependency vulnerability scan
        run: python -m pip_audit --requirement backend/requirements.txt --strict

      - name: Migration check (from empty database)
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Run backend tests (PostgreSQL)
        run: python -m pytest -q
        working-directory: backend
